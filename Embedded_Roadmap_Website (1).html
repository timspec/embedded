<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Embedded Systems &amp; Firmware Engineering — 8-Month Build Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --radius:3px;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  /* fixed "instrument panel" colors — always dark, regardless of theme */
  --panel:#141B16;
  --panel-elevated:#1B241E;
  --panel-hover:#212B24;
  --panel-active:#1E2921;
  --panel-input:#1D2620;
  --panel-line:#2A362E;
  --panel-text:#EAEFEA;
  --panel-text-soft:#C7D2C9;
  --panel-text-faint:#7C8A80;
  --panel-text-dim:#5E6C63;
  --panel-accent:#8FBF9F;

  /* fixed accent chips — same in both themes so meaning stays legible */
  --badge-accent:#1F6F4A;

  /* fixed "pinned note" callout — always warm/light, pops in both themes */
  --capstone-bg:#F6E9D7;
  --capstone-border:#E4C494;
  --capstone-accent:#BD7A2C;
  --capstone-text:#4A371C;
  --capstone-label:#8C5A1E;

  /* theme-reactive surface colors — light defaults */
  --paper:#F1F4F0;
  --paper-raised:#FFFFFF;
  --ink:#16221B;
  --ink-soft:#48544B;
  --ink-faint:#657266;
  --line:#CBD4C7;
  --line-soft:#DEE5DB;
  --pcb:#1E6E4A;
  --pcb-dark:#164F36;
  --pcb-tint:#E4F0E9;
  --copper:#A5661F;
  --copper-tint:#F6E9D7;
  --badge-default:#16221B;
  --grid-rgb:30,110,74;
  --grid-alpha:0.045;
  --shadow-rgb:22,34,27;
}

[data-theme="dark"]{
  --paper:#121712;
  --paper-raised:#1A211B;
  --ink:#E9EFE7;
  --ink-soft:#B4BFB2;
  --ink-faint:#8B968A;
  --line:#333F35;
  --line-soft:#262F27;
  --pcb:#49C98A;
  --pcb-dark:#37A874;
  --pcb-tint:#16261D;
  --copper:#E6A84F;
  --copper-tint:#2C2213;
  --badge-default:#0B0F0B;
  --grid-rgb:73,201,138;
  --grid-alpha:0.05;
  --shadow-rgb:0,0,0;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, rgba(var(--grid-rgb), var(--grid-alpha)) 0px, rgba(var(--grid-rgb), var(--grid-alpha)) 1px, transparent 1px, transparent 32px),
    repeating-linear-gradient(90deg, rgba(var(--grid-rgb), var(--grid-alpha)) 0px, rgba(var(--grid-rgb), var(--grid-alpha)) 1px, transparent 1px, transparent 32px);
  -webkit-font-smoothing:antialiased;
  transition:background-color .18s ease, color .18s ease;
}
a{color:inherit;}
::selection{background:var(--pcb);color:#fff;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
svg{display:block;width:1em;height:1em;flex-shrink:0;}

a:focus-visible, button:focus-visible, input:focus-visible,
[tabindex]:focus-visible, .day-head:focus-visible{
  outline:2px solid var(--pcb);outline-offset:2px;border-radius:2px;
}

/* ---------- Layout shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:280px;flex:none;
  background:var(--panel);
  color:var(--panel-text);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
  z-index:30;
}
.sidebar::-webkit-scrollbar{width:8px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--panel-line);border-radius:4px;}

.brand{
  padding:20px 16px 16px 20px;
  border-bottom:1px solid var(--panel-line);
  display:flex;align-items:center;gap:11px;
}
.brand-mark{width:30px;height:30px;flex:none;}
.brand-text{line-height:1.15;min-width:0;}
.brand-text .l1{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--panel-accent);text-transform:uppercase;}
.brand-text .l2{font-size:14.5px;font-weight:600;color:#fff;margin-top:2px;}

.theme-toggle{
  margin-left:auto;flex:none;width:32px;height:32px;border-radius:var(--radius);
  background:var(--panel-input);border:1px solid var(--panel-line);color:var(--panel-text-soft);
  display:flex;align-items:center;justify-content:center;transition:border-color .12s ease, color .12s ease;
}
.theme-toggle:hover{border-color:var(--pcb);color:#fff;}
.theme-toggle svg{width:16px;height:16px;}
.theme-toggle .icon-moon{display:block;}
.theme-toggle .icon-sun{display:none;}
[data-theme="dark"] .theme-toggle .icon-moon{display:none;}
[data-theme="dark"] .theme-toggle .icon-sun{display:block;}

.search-wrap{padding:14px 16px;border-bottom:1px solid var(--panel-line);position:relative;}
.search-input{
  width:100%;background:var(--panel-input);border:1px solid var(--panel-line);color:var(--panel-text);
  padding:9px 10px 9px 30px;border-radius:var(--radius);font-size:13px;
  outline:none;
}
.search-input::placeholder{color:var(--panel-text-dim);}
.search-input:focus-visible{border-color:var(--pcb);outline:none;}
.search-icon{position:absolute;left:26px;top:23px;width:14px;height:14px;color:var(--panel-text-dim);pointer-events:none;}
.search-results{
  position:absolute;left:16px;right:16px;top:52px;background:var(--panel-elevated);border:1px solid var(--panel-line);
  border-radius:var(--radius);max-height:320px;overflow-y:auto;display:none;box-shadow:0 12px 28px rgba(0,0,0,.35);
}
.search-results.show{display:block;}
.search-results .sr-item{padding:9px 12px;border-bottom:1px solid var(--panel-line);font-size:12.5px;cursor:pointer;}
.search-results .sr-item:last-child{border-bottom:none;}
.search-results .sr-item:hover,.search-results .sr-item.highlighted{background:var(--panel-hover);}
.search-results .sr-tag{font-family:var(--mono);font-size:10px;color:var(--panel-accent);letter-spacing:.05em;}
.search-results .sr-title{color:var(--panel-text);margin-top:2px;}
.search-empty{padding:12px;font-size:12.5px;color:var(--panel-text-dim);}

nav.navlist{padding:10px 10px 14px;flex:1;}
.nav-section-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--panel-text-dim);
  padding:12px 10px 6px;text-transform:uppercase;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius);
  font-size:13.5px;color:var(--panel-text-soft);text-decoration:none;
  border-left:2px solid transparent;
  margin-bottom:2px;
}
.nav-item:hover{background:var(--panel-hover);color:#fff;}
.nav-item.active{background:var(--panel-active);color:#fff;border-left-color:var(--pcb);}
.nav-num{font-family:var(--mono);font-size:11px;color:var(--panel-text-faint);flex:none;width:26px;}
.nav-item.active .nav-num{color:var(--panel-accent);}
.nav-label{flex:1;line-height:1.3;}
.nav-progress{font-family:var(--mono);font-size:10px;color:var(--panel-text-faint);flex:none;}
.nav-item.active .nav-progress{color:var(--panel-accent);}

.sidebar-foot{
  padding:14px 20px 18px;border-top:1px solid var(--panel-line);
  font-family:var(--mono);font-size:10.5px;color:var(--panel-text-dim);line-height:1.6;
}
.sidebar-foot b{color:var(--panel-accent);font-weight:500;}
.reset-btn{
  margin-top:10px;background:transparent;border:1px solid var(--panel-line);color:var(--panel-text-soft);
  padding:6px 10px;border-radius:var(--radius);font-family:var(--mono);font-size:10.5px;
  display:inline-flex;align-items:center;gap:6px;transition:border-color .12s ease, color .12s ease;
}
.reset-btn:hover{border-color:#C0574A;color:#fff;}
.reset-btn svg{width:12px;height:12px;}

.io-row{display:flex;gap:8px;margin-top:12px;}
.io-btn{
  flex:1;background:transparent;border:1px solid var(--panel-line);color:var(--panel-text-soft);
  padding:6px 8px;border-radius:var(--radius);font-family:var(--mono);font-size:10.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:border-color .12s ease, color .12s ease;
}
.io-btn:hover{border-color:var(--pcb);color:#fff;}
.io-btn svg{width:12px;height:12px;}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:var(--panel);color:var(--panel-text);border:1px solid var(--panel-line);
  padding:11px 18px;border-radius:var(--radius);font-size:13px;
  box-shadow:0 14px 30px rgba(0,0,0,.28);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{border-color:#C0574A;}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;}
.topbar{
  display:none;position:sticky;top:0;z-index:20;background:var(--panel);color:#fff;
  padding:12px 16px;align-items:center;justify-content:space-between;gap:10px;
}
.topbar-btn{background:transparent;border:1px solid var(--panel-line);color:#fff;padding:7px 10px;border-radius:var(--radius);
  display:flex;align-items:center;gap:7px;font-size:12.5px;}
.topbar-btn svg{width:15px;height:15px;}
.topbar-title{font-family:var(--mono);font-size:12px;color:var(--panel-text-soft);}
.view{padding:44px 56px 90px;max-width:1180px;}
.view.hidden{display:none;}

/* ---------- Overview hero ---------- */
.hero{margin-bottom:38px;}
.hero-eyebrow{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--pcb);
  display:flex;align-items:center;gap:8px;margin-bottom:16px;
}
.hero-eyebrow .dot{width:6px;height:6px;background:var(--copper);border-radius:50%;display:inline-block;}
.hero h1{
  font-size:44px;line-height:1.12;font-weight:700;letter-spacing:-0.015em;margin:0 0 16px;
  max-width:820px;
}
.hero p.lead{font-size:16.5px;line-height:1.6;color:var(--ink-soft);max-width:620px;margin:0 0 30px;}

.spec-table{border:1px solid var(--line);background:var(--paper-raised);border-radius:var(--radius);overflow:hidden;max-width:900px;}
.spec-title{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--panel);color:var(--panel-text);padding:8px 14px;
}
.spec-grid{display:grid;grid-template-columns:repeat(5,1fr);}
.spec-cell{padding:16px 14px;border-right:1px solid var(--line-soft);border-top:1px solid var(--line-soft);}
.spec-cell:nth-child(5n){border-right:none;}
.spec-val{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--pcb-dark);line-height:1;}
[data-theme="dark"] .spec-val{color:var(--pcb);}
.spec-unit{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:3px;}
.spec-label{font-size:11.5px;color:var(--ink-soft);margin-top:7px;}

/* ---------- Section heading ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:56px 0 18px;gap:20px;flex-wrap:wrap;}
.section-head h2{font-size:22px;font-weight:600;margin:0;letter-spacing:-0.01em;}
.section-head .sh-note{font-size:13px;color:var(--ink-faint);}

/* ---------- Phase grid (overview) ---------- */
.phase-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.phase-tile{
  background:var(--paper-raised);border:1px solid var(--line);border-left:3px solid var(--pcb);
  border-radius:var(--radius);padding:16px 16px 14px;cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.phase-tile:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(var(--shadow-rgb),0.12);}
.phase-tile .pt-num{font-family:var(--mono);font-size:11px;color:var(--copper);letter-spacing:.05em;}
.phase-tile .pt-title{font-size:14.5px;font-weight:600;margin:6px 0 8px;line-height:1.3;min-height:38px;}
.phase-tile .pt-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);}

/* ---------- Skills checklist ---------- */
.skill-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;max-width:980px;}
.skill-item{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-soft);line-height:1.5;padding:6px 0;border-bottom:1px dashed var(--line-soft);}
.skill-item svg{width:17px;height:17px;flex:none;margin-top:2px;color:var(--pcb);}

/* ---------- Phase view ---------- */
.phase-head{margin-bottom:8px;}
.phase-head .ph-tag{font-family:var(--mono);font-size:12px;color:var(--copper);letter-spacing:.06em;}
.phase-head h1{font-size:32px;margin:8px 0 12px;line-height:1.18;max-width:760px;}
.phase-head .ph-goal{font-size:15px;color:var(--ink-soft);line-height:1.6;max-width:720px;margin:0 0 18px;}

.phase-progress{display:flex;align-items:center;gap:14px;margin-bottom:26px;max-width:640px;flex-wrap:wrap;}
.phase-progress .pp-track{flex:1;min-width:160px;height:7px;background:var(--line-soft);border-radius:6px;overflow:hidden;}
.phase-progress .pp-fill{height:100%;background:linear-gradient(90deg,var(--pcb),var(--pcb-dark));width:0%;transition:width .25s ease;}
.phase-progress .pp-text{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}

.capstone-box{
  background:var(--capstone-bg);border:1px solid var(--capstone-border);border-left:3px solid var(--capstone-accent);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:30px;max-width:900px;
}
.capstone-box .cb-label{font-family:var(--mono);font-size:11px;letter-spacing:.07em;color:var(--capstone-label);text-transform:uppercase;margin-bottom:6px;}
.capstone-box .cb-text{font-size:14.5px;color:var(--capstone-text);line-height:1.55;}

.week-block{margin-bottom:30px;}
.week-label{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;color:var(--ink-faint);
  padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:2px;text-transform:uppercase;
}

.day-row{border-bottom:1px solid var(--line-soft);background:var(--paper-raised);}
.day-row.revision{background:var(--pcb-tint);}
.day-head{display:flex;align-items:center;gap:14px;padding:13px 14px;cursor:pointer;}
.day-badge{
  font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--badge-default);
  padding:4px 8px;border-radius:var(--radius);flex:none;min-width:34px;text-align:center;
}
.day-row.revision .day-badge{background:var(--badge-accent);}
.day-week-tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);flex:none;width:44px;}
.day-topic{flex:1;font-size:14.5px;font-weight:600;min-width:0;}
.day-review-tag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--pcb-dark);
  background:var(--paper-raised);border:1px solid var(--pcb);padding:2px 6px;border-radius:2px;flex:none;
}
[data-theme="dark"] .day-review-tag{color:var(--pcb);}
.day-hours{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);flex:none;}

.day-check{flex:none;display:flex;align-items:center;}
.day-check input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;margin:0;
  width:19px;height:19px;border:1.6px solid var(--line);border-radius:4px;
  background:var(--paper-raised);cursor:pointer;position:relative;flex:none;
  transition:background .12s ease, border-color .12s ease;
}
.day-check input[type="checkbox"]:hover{border-color:var(--pcb);}
.day-check input[type="checkbox"]:checked{background:var(--pcb);border-color:var(--pcb);}
.day-check input[type="checkbox"]:checked::after{
  content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
}
.day-chevron{flex:none;width:16px;height:16px;color:var(--ink-faint);transition:transform .15s ease;}
.day-chevron svg{width:100%;height:100%;}
.day-row.open .day-chevron{transform:rotate(90deg);}

.day-body{display:none;padding:0 14px 20px 62px;}
.day-row.open .day-body{display:block;}
.day-tasks{font-size:14px;color:var(--ink-soft);line-height:1.65;max-width:760px;margin-bottom:14px;}
.res-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.res-pill{
  display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);
  padding:7px 11px;border-radius:20px;font-size:12.5px;text-decoration:none;color:var(--ink);
  transition:border-color .12s ease, background .12s ease;
}
.res-pill:hover,.res-pill:focus-visible{border-color:var(--pcb);background:var(--pcb-tint);}
.res-pill .res-kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase;}
.res-pill svg{flex:none;width:13px;height:13px;color:var(--ink-soft);}
.practice-box{
  background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);
  padding:11px 14px;font-size:13.5px;color:var(--ink-soft);max-width:760px;line-height:1.55;
}
.practice-box b{color:var(--ink);font-weight:600;}

/* ---------- Showcase view ---------- */
.sc-block{margin-bottom:34px;}
.sc-block h3{font-size:17px;font-weight:600;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
.sc-item{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--line-soft);}
.sc-item .sc-idx{font-family:var(--mono);font-size:12px;color:var(--copper);flex:none;width:22px;padding-top:2px;}
.sc-item .sc-body{flex:1;min-width:0;}
.sc-item .sc-label{font-size:14.5px;font-weight:600;margin-bottom:4px;}
.sc-item .sc-detail{font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
.sc-item .sc-link{margin-top:7px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--pcb-dark);text-decoration:none;border-bottom:1px solid var(--pcb);}
[data-theme="dark"] .sc-item .sc-link{color:var(--pcb);}
.sc-item .sc-link svg{width:12px;height:12px;}

/* ---------- Progress bar on overview ---------- */
.progress-wrap{display:flex;align-items:center;gap:16px;margin-top:26px;flex-wrap:wrap;}
.progress-bar-track{flex:1;max-width:420px;height:8px;background:var(--line-soft);border-radius:6px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--pcb),var(--pcb-dark));width:0%;transition:width .25s ease;}
.progress-text{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);}

/* ---------- Footer nav (prev/next phase) ---------- */
.phase-nav{display:flex;justify-content:space-between;margin-top:40px;padding-top:24px;border-top:1px solid var(--line);gap:14px;flex-wrap:wrap;}
.pn-btn{
  display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);
  padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius);max-width:280px;
  transition:border-color .12s ease;
}
.pn-btn:hover,.pn-btn:focus-visible{border-color:var(--pcb);}
.pn-btn .pn-dir{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.06em;}
.pn-btn .pn-name{font-size:13.5px;font-weight:600;}
.pn-btn.next{text-align:right;align-items:flex-end;margin-left:auto;}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;}
.overlay.show{display:block;}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .phase-grid{grid-template-columns:repeat(2,1fr);}
  .spec-grid{grid-template-columns:repeat(3,1fr);}
  .spec-cell:nth-child(3n){border-right:none;}
  .skill-list{grid-template-columns:1fr;}
}
@media (max-width:760px){
  .sidebar{position:fixed;left:-300px;top:0;transition:left .2s ease;width:270px;height:100vh;}
  .sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.4);}
  .topbar{display:flex;}
  .view{padding:26px 18px 70px;}
  .hero h1{font-size:28px;}
  .spec-grid{grid-template-columns:repeat(2,1fr);}
  .spec-cell:nth-child(2n){border-right:none;}
  .phase-grid{grid-template-columns:1fr;}
  .day-body{padding-left:14px;}
  .day-topic{font-size:13.5px;}
  .day-hours{display:none;}
  .capstone-box{max-width:100%;}
  .phase-nav{flex-direction:column;}
  .pn-btn.next{margin-left:0;text-align:left;align-items:flex-start;}
  .pn-btn{max-width:100%;}
}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}

eadiness","goal":"Build two strong, distinct capstone projects, create a professional portfolio and resume, master interview topics, and run a structured job-application sprint.","project":"Two Capstone Projects (choose distinct domains, e.g., Smart Home Automation + Automotive/Industrial Monitor) + a live GitHub Pages portfolio + a polished resume + 20+ active job applications with a tracked pipeline.","days":[{"Day":1,"Week":1,"Topic":"Capstone Planning","Tasks":"Choose 2 distinct-domain capstone project ideas; write requirement docs, block diagrams, and BOM (bill of materials).","YT_Name":"Phil's Lab (STM32/PCB/Firmware)","YT_Link":"https://www.youtube.com/phils94","Other_Name":"Embedded.com Articles","Other_Link":"https://www.embedded.com/","Practice":"Finalize project scope docs for both capstones with a feature list and success criteria.","Hours":3},{"Day":2,"Week":1,"Topic":"Capstone 1 - Hardware Bring-up","Tasks":"Assemble/simulate hardware for Capstone Project 1 (e.g., Smart Home Automation).","YT_Name":"Phil's Lab (STM32/PCB/Firmware)","YT_Link":"https://www.youtube.com/phils94","Other_Name":"Wokwi Online Simulator (Arduino/ESP32/STM32)","Other_Link":"https://wokwi.com/","Practice":"Wire up and power-on-test all hardware modules for Capstone 1.","Hours":4},{"Day":3,"Week":1,"Topic":"Capstone 1 - Core Firmware","Tasks":"Write core firmware: peripheral drivers, sensor reading, actuator control.","YT_Name":"Phil's Lab (STM32/PCB/Firmware)","YT_Link":"https://www.youtube.com/phils94","Other_Name":"ST Official STM32 Documentation","Other_Link":"https://www.st.com/en/microcontrollers-microprocessors/stm32-32-bit-arm-cortex-mcus.html","Practice":"Implement and test the core control logic of Capstone 1 module by module.","Hours":4},{"Day":4,"Week":1,"Topic":"Capstone 1 - Connectivity Layer","Tasks":"Add UART/Wi-Fi/BLE layer for remote monitoring or control.","YT_Name":"Low Level Learning","YT_Link":"https://www.youtube.com/@LowLevelLearning","Other_Name":"HiveMQ - MQTT Essentials","Other_Link":"https://www.hivemq.com/mqtt-essentials/","Practice":"Integrate connectivity (app/MQTT/web) into Capstone 1 and verify end-to-end data flow.","Hours":4},{"Day":5,"Week":1,"Topic":"Capstone 1 - RTOS/Robustness","Tasks":"Add FreeRTOS task structure and watchdog/error-handling for reliability.","YT_Name":"Low Level Learning","YT_Link":"https://www.youtube.com/@LowLevelLearning","Other_Name":"FreeRTOS Official Docs","Other_Link":"https://www.freertos.org/","Practice":"Refactor Capstone 1 into RTOS tasks with a watchdog for fault recovery.","Hours":4},{"Day":6,"Week":1,"Topic":"Capstone 1 - Polish","Tasks":"UI polish (LCD/app), edge-case handling, code cleanup.","YT_Name":"Phil's Lab (STM32/PCB/Firmware)","YT_Link":"https://www.youtube.com/phils94","Other_Name":"Cppcheck Static Analysis Docs","Other_Link":"https://cppcheck.sourceforge.io/","Practice":"Run static analysis on Capstone 1, fix warnings, and polish the user-facing behaviour.","Hours":3},{"Day":7,"Week":1,"Topic":"Capstone 1 - Testing & Debugging","Tasks":"End-to-end testing under real conditions; fix bugs found; document known limitations.","YT_Name":"Low Level Learning","YT_Link":"https://www.youtube.com/@LowLevelLearning","Other_Name":"SEGGER J-Link/SystemView Docs","Other_Link":"https://www.segger.com/products/debug-probes/j-link/tools/j-link-plugins/","Practice":"Run a full test pass on Capstone 1 covering normal operation, edge cases, and failure recovery.","Hours":3},{"Day":8,"Week":2,"Topic":"Capstone 2 - Planning & Bring-up","Tasks":"Start second capstone in a different domain (e.g., automotive CAN-based system, medical vitals monitor, or robotics).","YT_Name":"Phil's Lab (STM32/PCB/Firmware)","YT_Link":"https://www.youtube.com/phils94","Other_Name":"CAN Bus / CiA Learn Resources","Other_Link":"https://www.can-cia.org/can-knowledge/","Practice":"Finalize architecture and assemble/simulate hardware for Capstone 2.","Hours":4},{"Day":9,"Week":2,"Topic":"Capstone 2 - Core Firmware","Tasks":"Implement drivers and core control logic for Capstone 2.","YT_Name":"Phil's Lab (STM32/PCB/Firmware)","YT_Link":"https://www.youtube.com/phils94","Other_Name":"ST Official STM32 Documentation","Other_Link":"https://www.st.com/en/microcontrollers-microprocessors/stm32-32-bit-arm-cortex-mcus.html","Practice":"Get Capstone 2's core sensing/actuation logic working end-to-end.","Hours":4},{"Day":10,"Week":2,"Topic":"Capstone 2 - Communication Protocols","Tasks":"Integrate the relevant protocol stack (CAN/SPI/I2C) central to this project's domain.","YT_Name":"Phil's Lab (STM32/PCB/Firmware)","YT_Link":"https://www.youtube.com/phils94","Other_Name":"Electronics-Tutorials.ws","Other_Link":"https://www.electronics-tutorials.ws/","Practice":"Implement and test the protocol layer critical to Capstone 2 (e.g., CAN messaging).","Hours":4},{"Day":11,"Week":2,"Topic":"Capstone 2 - RTOS Integration","Tasks":"Structure Capstone 2 firmware using FreeRTOS tasks/queues for maintainability.","YT_Name":"Low Level Learning","YT_Link":"https://www.youtube.com/@LowLevelLearning","Other_Name":"FreeRTOS Official Docs","Other_Link":"https://www.freertos.org/","Practice":"Refactor Capstone 2 into a clean multi-task RTOS architecture.","Hours":4},{"Day":12,"Week":2,"Topic":"Capstone 2 - Testing & Debugging","Tasks":"Full testing pass, bug fixing, and performance profiling.","YT_Name":"Low Level Learning","YT_Link":"https://www.youtube.com/@LowLevelLearning","Other_Name":"SEGGER J-Link/SystemView Docs","Other_Link":"https://www.segger.com/products/debug-probes/j-link/tools/j-link-plugins/","Practice":"Test Capstone 2 thoroughly and document any known issues/future improvements.","Hours":3},{"Day":13,"Week":2,"Topic":"Resume Building for Embedded Roles","Tasks":"Structuring an embedded/firmware resume: skills section, project bullets with impact/metrics, ATS-friendly formatting.","YT_Name":"NetworkChuck (Linux/Networking)","YT_Link":"https://www.youtube.com/@NetworkChuck","Other_Name":"Novoresume - Free Resume Guide","Other_Link":"https://novoresume.com/career-blog/how-to-write-a-resume","Practice":"Draft a 1-page resume highlighting your 8 capstone/monthly projects with quantifiable impact statements.","Hours":3},{"Day":14,"Week":2,"Topic":"LinkedIn Profile Optimization","Tasks":"Headline, About section, featured projects, skills endorsements for embedded/firmware roles.","YT_Name":"NetworkChuck (Linux/Networking)","YT_Link":"https://www.youtube.com/@NetworkChuck","Other_Name":"LinkedIn Profile Optimization Guide","Other_Link":"https://www.linkedin.com/business/talent/blog/product-tips/tips-to-improve-your-linkedin-profile","Practice":"Fully update your LinkedIn profile with headline, about section, and all major projects listed.","Hours":2},{"Day":15,"Week":3,"Topic":"Portfolio Website","Tasks":"Build a simple portfolio site using GitHub Pages listing all 8 months of projects with descriptions/links.","YT_Name":"NetworkChuck (Linux/Networking)","YT_Link":"https://www.youtube.com/@NetworkChuck","Other_Name":"GitHub Pages - Free Portfolio Hosting","Other_Link":"https://pages.github.com/","Practice":"Publish a live GitHub Pages portfolio site showcasing your top 6-8 projects with images/GIFs.","Hours":4},{"Day":16,"Week":3,"Topic":"Polish GitHub Repositories","Tasks":"Ensure every repo has a great README: overview, hardware used, wiring diagram, build steps, demo GIF/photo.","YT_Name":"NetworkChuck (Linux/Networking)","YT_Link":"https://www.youtube.com/@NetworkChuck","Other_Name":"GitHub Skills (Free Interactive Courses)","Other_Link":"https://skills.github.com/","Practice":"Rewrite README files for your top 5 repositories to professional portfolio quality.","Hours":3},{"Day":17,"Week":3,"Topic":"Interview Prep - Embedded C","Tasks":"Practice classic embedded-C interview questions: pointers, volatile, const, bit-fields, memory layout, structure padding.","YT_Name":"Jacob Sorber (Low-level C & Embedded)","YT_Link":"https://www.youtube.com/@JacobSorber","Other_Name":"InterviewBit","Other_Link":"https://www.interviewbit.com/","Practice":"Answer (in writing) 20 classic embedded-C interview questions from memory, then verify against references.","Hours":3},{"Day":18,"Week":3,"Topic":"Interview Prep - DS & OS","Tasks":"Practice data structures and OS interview questions relevant to embedded roles (linked lists, queues, scheduling, semaphores).","YT_Name":"Low Level Learning","YT_Link":"https://www.youtube.com/@LowLevelLearning","Other_Name":"GeeksforGeeks","Other_Link":"https://www.geeksforgeeks.org/","Practice":"Solve 10 medium DS problems + answer 10 OS/RTOS conceptual questions.","Hours":3},{"Day":19,"Week":3,"Topic":"Interview Prep - Electronics & Protocols","Tasks":"Practice digital electronics and communication protocol interview questions (UART/SPI/I2C/CAN differences, flip-flops, K-maps).","YT_Name":"Ben Eater (Digital Logic/Computer Architecture)","YT_Link":"https://www.youtube.com/@BenEater","Other_Name":"Electronics-Tutorials.ws","Other_Link":"https://www.electronics-tutorials.ws/","Practice":"Prepare written answers for 15 common digital-electronics and protocol interview questions.","Hours":3},{"Day":20,"Week":3,"Topic":"Mock Technical Interview","Tasks":"Simulate a full technical interview (record yourself or pair with a peer/mentor); review recording for clarity and gaps.","YT_Name":"Jacob Sorber (Low-level C & Embedded)","YT_Link":"https://www.youtube.com/@JacobSorber","Other_Name":"InterviewBit","Other_Link":"https://www.interviewbit.com/","Practice":"Complete one full 45-60 min mock technical interview and note 3 areas to improve.","Hours":3},{"Day":21,"Week":3,"Topic":"Revision of Weak Areas","Tasks":"Identify weakest topics from the mock interview and revisit those specific resources from earlier months.","YT_Name":"Low Level Learning","YT_Link":"https://www.youtube.com/@LowLevelLearning","Other_Name":"GeeksforGeeks","Other_Link":"https://www.geeksforgeeks.org/","Practice":"Deep-revise your 3 weakest topics identified from Day 20's mock interview.","Hours":3},{"Day":22,"Week":4,"Topic":"Job Applications - Round 1","Tasks":"Search and apply to embedded/firmware roles on job portals and company career pages; tailor resume per role.","YT_Name":"NetworkChuck (Linux/Networking)","YT_Link":"https://www.youtube.com/@NetworkChuck","Other_Name":"Novoresume - Free Resume Guide","Other_Link":"https://novoresume.com/career-blog/how-to-write-a-resume","Practice":"Apply to at least 10 relevant embedded/firmware job openings with a tailored resume/cover note each.","Hours":3},{"Day":23,"Week":4,"Topic":"Open-Source Contribution","Tasks":"Contribute a small fix/feature/doc improvement to an open-source embedded project (e.g., Zephyr, FreeRTOS-community examples).","YT_Name":"Low Level Learning","YT_Link":"https://www.youtube.com/@LowLevelLearning","Other_Name":"Zephyr RTOS Documentation","Other_Link":"https://docs.zephyrproject.org/","Practice":"Find a 'good first issue' in an embedded open-source repo and submit a pull request.","Hours":3},{"Day":24,"Week":4,"Topic":"Technical Blog Post","Tasks":"Write and publish a technical blog post explaining one of your capstone projects in depth.","YT_Name":"NetworkChuck (Linux/Networking)","YT_Link":"https://www.youtube.com/@NetworkChuck","Other_Name":"Dev.to Publishing Platform","Other_Link":"https://dev.to/","Practice":"Publish a detailed blog post (Dev.to/Hashnode/Medium) about your favourite capstone project.","Hours":3},{"Day":25,"Week":4,"Topic":"HR & Behavioral Interview Prep","Tasks":"Practice common behavioral questions (STAR method), 'tell me about yourself', teamwork/conflict examples from projects.","YT_Name":"NetworkChuck (Linux/Networking)","YT_Link":"https://www.youtube.com/@NetworkChuck","Other_Name":"Novoresume - Free Resume Guide","Other_Link":"https://novoresume.com/career-blog/how-to-write-a-resume","Practice":"Prepare STAR-format answers for 8 common behavioral interview questions using your project experiences.","Hours":2},{"Day":26,"Week":4,"Topic":"Networking & Community Engagement","Tasks":"Engage with embedded communities (r/embedded, Discord servers, LinkedIn groups); reach out to engineers for informational chats.","YT_Name":"NetworkChuck (Linux/Networking)","YT_Link":"https://www.youtube.com/@NetworkChuck","Other_Name":"r/embedded Community","Other_Link":"https://www.reddit.com/r/embedded/","Practice":"Make 5 meaningful posts/comments in embedded communities and send 5 LinkedIn connection notes to embedded engineers.","Hours":2},{"Day":27,"Week":4,"Topic":"Final Resume/Portfolio Review + Applications","Tasks":"Get feedback on resume/portfolio (peer/mentor/online community); apply to another batch of roles.","YT_Name":"NetworkChuck (Linux/Networking)","YT_Link":"https://www.youtube.com/@NetworkChuck","Other_Name":"Novoresume - Free Resume Guide","Other_Link":"https://novoresume.com/career-blog/how-to-write-a-resume","Practice":"Incorporate feedback into your resume/portfolio; apply to 10 more job openings (20+ total this month).","Hours":3},{"Day":28,"Week":4,"Topic":"Reflect, Refine & Continue the Sprint","Tasks":"Review the full 8-month journey, update portfolio with latest project, keep the application/interview sprint going.","YT_Name":"Low Level Learning","YT_Link":"https://www.youtube.com/@LowLevelLearning","Other_Name":"GitHub Skills (Free Interactive Courses)","Other_Link":"https://skills.github.com/","Practice":"Write a personal '8-month embedded journey' reflection post/README and set a weekly job-search routine going forward.","Hours":3}]}],"showcase":[{"title":"1. Build a Professional GitHub Portfolio","items":[{"label":"Create one repo per project","detail":"Every monthly capstone + notable mini-project gets its own public repo with a clear, descriptive name (e.g., 'stm32-freertos-weather-station').","link_name":"GitHub Skills","link_url":"https://skills.github.com/"},{"label":"Write a portfolio-grade README per repo","detail":"Include: 1-2 line summary, hardware used, wiring diagram/schematic image, features, how to build/flash, demo photo or GIF, what you learned.","link_name":"Awesome README examples","link_url":"https://github.com/matiassingers/awesome-readme"},{"label":"Pin your best 6 repos","detail":"Pin projects that show breadth: a C/DS project, an AVR register-level project, an STM32/HAL project, an RTOS project, a protocol-heavy project, an IoT project.","link_name":"GitHub Profile Docs","link_url":"https://docs.github.com/en/account-and-profile"},{"label":"Add a GitHub profile README","detail":"Create the special 'username/username' repo with a profile README summarizing your embedded skills, tools and links to top projects.","link_name":"Profile README Guide","link_url":"https://docs.github.com/en/account-and-profile/setting-up-and-managing-your-github-profile/customizing-your-profile/managing-your-profile-readme"},{"label":"Keep commit history clean & consistent","detail":"Commit regularly, not one giant commit; use clear messages like 'Add I2C sensor driver with retry logic' instead of 'update'.","link_name":"Conventional Commits","link_url":"https://www.conventionalcommits.org/"}]},{"title":"2. Build a Personal Portfolio Website (Free)","items":[{"label":"Publish a GitHub Pages site","detail":"Free hosting for a single-page portfolio: About, Skills, Projects (images/GIFs + GitHub links), Resume download, Contact.","link_name":"GitHub Pages","link_url":"https://pages.github.com/"},{"label":"Use a free template if short on time","detail":"Don't design from scratch under deadline - use a free portfolio template and customize the content.","link_name":"Free Jekyll Themes","link_url":"https://jekyllthemes.io/free"},{"label":"Add short demo videos/GIFs","detail":"A 15-30 second GIF of your project working is far more convincing than text alone.","link_name":"ScreenToGif (free tool)","link_url":"https://www.screentogif.com/"}]},{"title":"3. Optimize Your Resume","items":[{"label":"Use a clean, ATS-friendly 1-page format","detail":"Avoid heavy graphics/tables that break Applicant Tracking Systems. Sections: Summary, Skills, Projects, Education, Certifications.","link_name":"Resume Writing Guide","link_url":"https://novoresume.com/career-blog/how-to-write-a-resume"},{"label":"Write project bullets with impact, not tasks","detail":"Instead of 'Made a sensor project': 'Built an I2C environmental monitor on STM32 with FreeRTOS; cut CPU idle time 30% using interrupt-driven UART reporting.'","link_name":null,"link_url":null},{"label":"List concrete tools & protocols","detail":"C, Embedded C, AVR, ARM Cortex-M, STM32 HAL/CMSIS, FreeRTOS, UART/SPI/I2C/CAN, Git, Linux, Makefile/CMake, ST-Link, logic analyzer.","link_name":null,"link_url":null},{"label":"Quantify wherever possible","detail":"Memory footprint reduced, latency achieved, number of sensors integrated, lines of tests written, % test coverage.","link_name":null,"link_url":null}]},{"title":"4. LinkedIn & Professional Presence","items":[{"label":"Write a clear headline","detail":"e.g., 'Embedded Systems | Firmware Engineer | C, ARM Cortex-M, STM32, FreeRTOS | Actively Seeking Opportunities'.","link_name":"LinkedIn Profile Tips","link_url":"https://www.linkedin.com/business/talent/blog/product-tips/tips-to-improve-your-linkedin-profile"},{"label":"Add every capstone project to Featured","detail":"Link each project's GitHub repo and a short description + demo image directly on your profile.","link_name":null,"link_url":null},{"label":"Post about your build progress","detail":"Short posts ('Day 45: synced FreeRTOS tasks with a semaphore - here's what I learned about priority inversion') build a public trail of growth.","link_name":null,"link_url":null},{"label":"Follow & engage with embedded companies/engineers","detail":"Follow companies you'd like to work for and comment thoughtfully on embedded-related posts.","link_name":null,"link_url":null}]},{"title":"5. Demonstrate Depth Beyond Projects","items":[{"label":"Write technical blog posts","detail":"Explain how you debugged a tricky I2C issue or designed your RTOS task architecture - this proves understanding, not copy-paste.","link_name":"Dev.to (free publishing)","link_url":"https://dev.to/"},{"label":"Contribute to open source","detail":"Submit small PRs (docs, examples, bug fixes) to projects like Zephyr RTOS - real collaboration experience employers value highly.","link_name":"Zephyr Good First Issues","link_url":"https://github.com/zephyrproject-rtos/zephyr/contribute"},{"label":"Participate in embedded communities","detail":"Answer beginner questions on r/embedded or Stack Overflow's embedded tag - teaching cements your own knowledge.","link_name":"r/embedded","link_url":"https://www.reddit.com/r/embedded/"},{"label":"Get a recognized certificate (optional)","detail":"Consider free-audit courses that carry a recognizable name to add to LinkedIn certifications.","link_name":"Coursera - Free Audit","link_url":"https://www.coursera.org/"}]},{"title":"6. Interview Preparation Checklist","items":[{"label":"Master core C & memory concepts","detail":"Pointers, pointer arithmetic, structure padding/alignment, volatile, const, static, memory leaks, stack vs heap.","link_name":"InterviewBit - Embedded C","link_url":"https://www.interviewbit.com/"},{"label":"Know your protocols cold","detail":"Be ready to draw UART/SPI/I2C timing diagrams from memory and explain trade-offs (speed, pin count, multi-device support).","link_name":"Electronics-Tutorials.ws","link_url":"https://www.electronics-tutorials.ws/"},{"label":"Practice RTOS scenario questions","detail":"'How would you design tasks for a system with a sensor, display and network module?' - reference your own capstones as real examples.","link_name":"FreeRTOS Docs","link_url":"https://www.freertos.org/"},{"label":"Be ready to whiteboard a state machine or ISR","detail":"Interviewers love asking for a live sketch of an ISR-safe producer/consumer design or a debounce state machine.","link_name":null,"link_url":null},{"label":"Prepare 3-4 project deep-dive stories (STAR)","detail":"Situation/Task, Action, Result - use your capstone projects as the backbone of these stories.","link_name":"STAR Method Guide","link_url":"https://novoresume.com/career-blog/how-to-write-a-resume"},{"label":"Practice on coding platforms","detail":"Keep basic DSA sharp alongside embedded-specific prep - many companies still ask general coding questions.","link_name":"LeetCode","link_url":"https://leetcode.com/"}]},{"title":"7. Job Search Strategy","items":[{"label":"Target the right roles/titles","detail":"Search: 'Embedded Software Engineer', 'Firmware Engineer', 'Embedded Systems Engineer - Entry Level', 'Embedded C Developer'.","link_name":null,"link_url":null},{"label":"Use multiple channels","detail":"Job portals + company career pages + referrals via LinkedIn connections + campus placement cells + embedded-focused job boards.","link_name":null,"link_url":null},{"label":"Track applications in a simple sheet","detail":"Company, Role, Date Applied, Status, Follow-up Date, Contact - don't lose track after 20+ applications.","link_name":null,"link_url":null},{"label":"Follow up politely after 1-2 weeks","detail":"A short, polite follow-up message to a recruiter or hiring manager meaningfully increases response rates.","link_name":null,"link_url":null},{"label":"Apply to internships/trainee programs too","detail":"Many strong embedded careers start via an internship or graduate-trainee program that converts to full-time.","link_name":null,"link_url":null}]}]};
</script>

  /* ---------------- Sidebar nav ---------------- */
  function renderNav(){
    let html = '<a class="nav-item" data-route="overview" href="#overview"><span class="nav-num">&#9670;</span><span class="nav-label">Overview</span></a>';
    html += '<div class="nav-section-label">Phases</div>';
    DATA.phases.forEach(p=>{
      const total = p.days.length;
      const done = p.days.filter(d=>state.done[dayKey(p.num,d.Day)]).length;
      html += `<a class="nav-item" data-route="phase-${p.num}" href="#phase-${p.num}">
        <span class="nav-num">${pad2(p.num)}</span>
        <span class="nav-label">${p.short}</span>
        <span class="nav-progress" data-progress-for="${p.num}">${done}/${total}</span>
      </a>`;
    });
    html += '<div class="nav-section-label">After Month 8</div>';
    html += '<a class="nav-item" data-route="showcase" href="#showcase"><span class="nav-num">&#9670;</span><span class="nav-label">Showcase &amp; Job Prep</span></a>';
    navList.innerHTML = html;
    navList.querySelectorAll(".nav-item").forEach(el=>{
      el.addEventListener("click", ()=>{ closeSidebarMobile(); });
    });
  }

  function setActiveNav(route){
    navList.querySelectorAll(".nav-item").forEach(el=>{
      el.classList.toggle("active", el.dataset.route===route);
    });
  }

  function updateNavProgress(){
    DATA.phases.forEach(p=>{
      const total = p.days.length;
      const done = p.days.filter(d=>state.done[dayKey(p.num,d.Day)]).length;
      const span = navList.querySelector(`.nav-progress[data-progress-for="${p.num}"]`);
      if(span) span.textContent = done+"/"+total;
    });
  }

  /* ---------------- Overview view ---------------- */
  function renderOverview(){
    const totalDays = DATA.phases.reduce((s,p)=>s+p.days.length,0);
    const totalDone = DATA.phases.reduce((s,p)=>s+p.days.filter(d=>state.done[dayKey(p.num,d.Day)]).length,0);
    const totalResources = totalDays*2;
    const pct = totalDays ? Math.round((totalDone/totalDays)*100) : 0;

    let phaseTiles = "";
    DATA.phases.forEach(p=>{
      phaseTiles += `<div class="phase-tile" data-route="phase-${p.num}" tabindex="0" role="button" aria-label="Open ${escAttr(p.short)}">
        <div class="pt-num">PHASE ${pad2(p.num)} — MONTH ${p.num}</div>
        <div class="pt-title">${p.short}</div>
        <div class="pt-meta">${p.days.length} days · capstone project</div>
      </div>`;
    });

    const skills = [
      "Strong C programming — pointers, memory management, structures, file I/O",
      "Data structures fundamentals for firmware — lists, stacks, queues, trees",
      "Digital &amp; analog electronics — gates, K-maps, flip-flops, breadboarding",
      "Register-level AVR &amp; ARM Cortex-M/STM32 programming, plus HAL/CubeMX",
      "UART, SPI, I2C, CAN — theory and hands-on driver writing",
      "RTOS with FreeRTOS — tasks, queues, semaphores, mutexes, memory management",
      "Embedded Linux basics, simple kernel/character device drivers",
      "Bootloaders, Makefiles/CMake, Git workflow, unit testing, CI basics",
      "Wireless/IoT with ESP32 — Wi-Fi, BLE, MQTT and cloud dashboards",
      "A professional GitHub portfolio, resume, and interview-ready knowledge",
    ];

    viewRoot.insertAdjacentHTML("beforeend", `
    <div class="view hidden" id="view-overview">
      <div class="hero">
        <div class="hero-eyebrow"><span class="dot"></span>ZERO TO FRESHER-JOB-READY · SELF-PACED</div>
        <h1>Embedded Systems &amp; Firmware Engineering, built one working circuit at a time.</h1>
        <p class="lead">An 8-month, day-by-day study plan — from your first "Hello World" in C to register-level ARM firmware, RTOS task design, and a portfolio that gets interviews. Every day links one video and one written resource, both free.</p>

        <div class="spec-table">
          <div class="spec-title">Program Specifications</div>
          <div class="spec-grid">
            <div class="spec-cell"><div class="spec-val">8<span class="spec-unit">mo</span></div><div class="spec-label">Total duration</div></div>
            <div class="spec-cell"><div class="spec-val">${totalDays}<span class="spec-unit">days</span></div><div class="spec-label">Study days planned</div></div>
            <div class="spec-cell"><div class="spec-val">${totalResources}<span class="spec-unit">links</span></div><div class="spec-label">Curated free resources</div></div>
            <div class="spec-cell"><div class="spec-val">9<span class="spec-unit">builds</span></div><div class="spec-label">Hands-on capstone projects</div></div>
            <div class="spec-cell"><div class="spec-val">2.5–4<span class="spec-unit">hr/day</span></div><div class="spec-label">Recommended pace</div></div>
          </div>
        </div>

        <div class="progress-wrap">
          <div class="progress-bar-track"><div class="progress-bar-fill" id="overallFill" style="width:${pct}%"></div></div>
          <div class="progress-text" id="overallText">${totalDone} / ${totalDays} days logged (${pct}%)</div>
        </div>
      </div>

      <div class="section-head"><h2>The 8 phases</h2><span class="sh-note">click a phase to open its day-by-day plan</span></div>
      <div class="phase-grid">${phaseTiles}</div>

      <div class="section-head"><h2>What you'll be able to do after Month 8</h2></div>
      <div class="skill-list">
        ${skills.map(s=>`<div class="skill-item">${iconCheck()}<span>${s}</span></div>`).join("")}
      </div>

      <div class="section-head"><h2>How this roadmap works</h2></div>
      <div class="skill-list" style="grid-template-columns:1fr;max-width:760px;">
        <div class="skill-item">${iconCheck()}<span>Each phase sheet covers one month, Day 1–28: roughly six study days plus one revision day per week, tagged <b>REVIEW</b>.</span></div>
        <div class="skill-item">${iconCheck()}<span>Every day lists a topic, detailed tasks, one YouTube resource, one other free resource, a hands-on practice task, and an hour estimate.</span></div>
        <div class="skill-item">${iconCheck()}<span>Follow days in order within a phase — later topics assume earlier ones. Tick days off as you finish them; your progress shows in the sidebar, phase pages, and this overview.</span></div>
        <div class="skill-item">${iconCheck()}<span>Progress lives in this browser tab only. Use <b>Export</b> in the sidebar to save it as a small file, and <b>Import</b> to restore it in a future session.</span></div>
        <div class="skill-item">${iconCheck()}<span>Each phase closes with a capstone project — build it fully before moving on. It becomes a portfolio piece.</span></div>
        <div class="skill-item">${iconCheck()}<span>The <b>Showcase &amp; Job Prep</b> section explains exactly how to present all of this to employers.</span></div>
      </div>
    </div>`);
  }

  /* ---------------- Phase view ---------------- */
  function renderPhase(p){
    const weeks = {};
    p.days.forEach(d=>{ (weeks[d.Week] = weeks[d.Week]||[]).push(d); });

    let weekHtml = "";
    Object.keys(weeks).sort((a,b)=>a-b).forEach(wk=>{
      let rows = "";
      weeks[wk].forEach(d=>{
        const key = dayKey(p.num, d.Day);
        const isRevision = d.Day % 7 === 0;
        const checked = state.done[key] ? "checked" : "";
        rows += `
        <div class="day-row ${isRevision?'revision':''}" data-key="${key}">
          <div class="day-head" tabindex="0" role="button" aria-expanded="false">
            <span class="day-badge">D${pad2(d.Day)}</span>
            <span class="day-week-tag">WK ${d.Week}</span>
            <span class="day-topic">${d.Topic}</span>
            ${isRevision?'<span class="day-review-tag">REVIEW</span>':''}
            <span class="day-hours">${d.Hours}h</span>
            <label class="day-check" title="Mark this day done">
              <input type="checkbox" ${checked} data-key="${key}" aria-label="Mark Day ${d.Day}, ${escAttr(d.Topic)}, as done">
            </label>
            <span class="day-chevron">${iconChevron()}</span>
          </div>
          <div class="day-body">
            <div class="day-tasks">${d.Tasks}</div>
            <div class="res-row">
              <a class="res-pill" href="${d.YT_Link}" target="_blank" rel="noopener">${iconYT()}<span><span class="res-kind">YouTube&nbsp;</span>${d.YT_Name}</span></a>
              <a class="res-pill" href="${d.Other_Link}" target="_blank" rel="noopener">${iconDoc()}<span><span class="res-kind">Read&nbsp;</span>${d.Other_Name}</span></a>
            </div>
            <div class="practice-box"><b>Hands-on practice —</b> ${d.Practice}</div>
          </div>
        </div>`;
      });
      weekHtml += `<div class="week-block"><div class="week-label">Week ${wk}</div>${rows}</div>`;
    });

    const idx = p.num - 1;
    const prev = DATA.phases[idx-1];
    const next = DATA.phases[idx+1];
    let navHtml = '<div class="phase-nav">';
    navHtml += prev ? `<a class="pn-btn prev" href="#phase-${prev.num}" data-route="phase-${prev.num}"><span class="pn-dir">&larr; PREVIOUS</span><span class="pn-name">${prev.short}</span></a>` : '<span></span>';
    navHtml += next ? `<a class="pn-btn next" href="#phase-${next.num}" data-route="phase-${next.num}"><span class="pn-dir">NEXT &rarr;</span><span class="pn-name">${next.short}</span></a>` : `<a class="pn-btn next" href="#showcase" data-route="showcase"><span class="pn-dir">NEXT &rarr;</span><span class="pn-name">Showcase &amp; Job Prep</span></a>`;
    navHtml += '</div>';

    const total = p.days.length;
    const done = p.days.filter(dd=>state.done[dayKey(p.num,dd.Day)]).length;
    const pct = total ? Math.round((done/total)*100) : 0;

    viewRoot.insertAdjacentHTML("beforeend", `
    <div class="view hidden" id="view-phase-${p.num}">
      <div class="phase-head">
        <div class="ph-tag">PHASE ${pad2(p.num)} · MONTH ${p.num} OF 8</div>
        <h1>${p.title}</h1>
        <p class="ph-goal">${p.goal}</p>
      </div>
      <div class="phase-progress">
        <div class="pp-track"><div class="pp-fill" id="phaseFill-${p.num}" style="width:${pct}%"></div></div>
        <div class="pp-text" id="phaseText-${p.num}">${done} / ${total} days logged (${pct}%)</div>
      </div>
      <div class="capstone-box">
        <div class="cb-label">Phase capstone project</div>
        <div class="cb-text">${p.project}</div>
      </div>
      ${weekHtml}
      ${navHtml}
    </div>`);
  }

  /* ---------------- Showcase view ---------------- */
  function renderShowcase(){
    let blocks = "";
    DATA.showcase.forEach(sec=>{
      let items = "";
      sec.items.forEach((it,i)=>{
        items += `<div class="sc-item">
          <div class="sc-idx">${pad2(i+1)}</div>
          <div class="sc-body">
            <div class="sc-label">${it.label}</div>
            <div class="sc-detail">${it.detail}</div>
            ${it.link_name?`<a class="sc-link" href="${it.link_url}" target="_blank" rel="noopener">${it.link_name}${iconArrow()}</a>`:''}
          </div>
        </div>`;
      });
      blocks += `<div class="sc-block"><h3>${sec.title}</h3>${items}</div>`;
    });

    viewRoot.insertAdjacentHTML("beforeend", `
    <div class="view hidden" id="view-showcase">
      <div class="phase-head">
        <div class="ph-tag">AFTER MONTH 8</div>
        <h1>How to showcase your skills</h1>
        <p class="ph-goal">A great firmware engineer with no proof of skill loses to an average one with a visible portfolio. Work through this checklist during Month 8 — and keep it running afterward.</p>
      </div>
      ${blocks}
      <div class="phase-nav">
        <a class="pn-btn prev" href="#phase-8" data-route="phase-8"><span class="pn-dir">&larr; PREVIOUS</span><span class="pn-name">Capstones &amp; Job Readiness</span></a>
        <a class="pn-btn next" href="#overview" data-route="overview"><span class="pn-dir">&uarr; BACK TO</span><span class="pn-name">Overview</span></a>
      </div>
    </div>`);
  }

  /* ---------------- Build + wire up ---------------- */
  function navigateTo(route){
    if(location.hash.replace("#","") === route){ showRoute(route); }
    else { location.hash = route; }
  }

  function buildAllViews(){
    renderOverview();
    DATA.phases.forEach(renderPhase);
    renderShowcase();

    viewRoot.querySelectorAll(".day-head").forEach(h=>{
      const toggle = ()=>{
        const row = h.closest(".day-row");
        const open = row.classList.toggle("open");
        h.setAttribute("aria-expanded", open ? "true" : "false");
      };
      h.addEventListener("click", toggle);
      h.addEventListener("keydown", (e)=>{
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); }
      });
    });

    viewRoot.querySelectorAll('input[type="checkbox"][data-key]').forEach(cb=>{
      cb.addEventListener("change", ()=>{
        state.done[cb.dataset.key] = cb.checked;
        const ph = keyPhase(cb.dataset.key);
        updateNavProgress();
        refreshOverviewProgress();
        if(ph) refreshPhaseProgress(ph);
        refreshFootCount();
      });
      cb.addEventListener("click", (e)=>e.stopPropagation());
    });

    viewRoot.querySelectorAll(".phase-tile").forEach(el=>{
      el.addEventListener("click", ()=>navigateTo(el.dataset.route));
      el.addEventListener("keydown", (e)=>{
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); navigateTo(el.dataset.route); }
      });
    });
  }

  function refreshOverviewProgress(){
    const totalDays = DATA.phases.reduce((s,p)=>s+p.days.length,0);
    const totalDone = DATA.phases.reduce((s,p)=>s+p.days.filter(d=>state.done[dayKey(p.num,d.Day)]).length,0);
    const pct = totalDays ? Math.round((totalDone/totalDays)*100) : 0;
    const fill = document.getElementById("overallFill");
    const text = document.getElementById("overallText");
    if(fill) fill.style.width = pct+"%";
    if(text) text.textContent = `${totalDone} / ${totalDays} days logged (${pct}%)`;
  }

  function keyPhase(key){
    const m = /^p(\d+)d\d+$/.exec(key);
    return m ? parseInt(m[1],10) : null;
  }

  function refreshPhaseProgress(phaseNum){
    const p = DATA.phases.find(pp=>pp.num===phaseNum);
    if(!p) return;
    const total = p.days.length;
    const done = p.days.filter(d=>state.done[dayKey(p.num,d.Day)]).length;
    const pct = total ? Math.round((done/total)*100) : 0;
    const fill = document.getElementById("phaseFill-"+phaseNum);
    const text = document.getElementById("phaseText-"+phaseNum);
    if(fill) fill.style.width = pct+"%";
    if(text) text.textContent = `${done} / ${total} days logged (${pct}%)`;
  }

  function refreshFootCount(){
    const totalDone = DATA.phases.reduce((s,p)=>s+p.days.filter(d=>state.done[dayKey(p.num,d.Day)]).length,0);
    const el = document.getElementById("footDoneCount");
    if(el) el.textContent = totalDone;
  }

  function refreshAllProgress(){
    updateNavProgress();
    refreshOverviewProgress();
    DATA.phases.forEach(p=>refreshPhaseProgress(p.num));
    refreshFootCount();
  }

  function showRoute(route){
    if(!route || !document.getElementById("view-"+route)) route = "overview";
    state.activeView = route;
    document.querySelectorAll(".view").forEach(v=>v.classList.add("hidden"));
    document.getElementById("view-"+route).classList.remove("hidden");
    setActiveNav(route);
    window.scrollTo(0,0);
  }

  window.addEventListener("hashchange", ()=>{
    showRoute(location.hash.replace("#",""));
  });

  /* ---------------- Search ---------------- */
  const searchInput = document.getElementById("searchInput");
  const searchResults = document.getElementById("searchResults");
  let searchHighlight = -1;

  function highlightItem(idx){
    const items = searchResults.querySelectorAll(".sr-item");
    items.forEach((it,i)=>it.classList.toggle("highlighted", i===idx));
    if(items[idx]) items[idx].scrollIntoView({block:"nearest"});
  }

  function runSearch(q){
    q = q.trim().toLowerCase();
    searchHighlight = -1;
    if(q.length < 2){ searchResults.classList.remove("show"); searchResults.innerHTML=""; return; }
    let matches = [];
    DATA.phases.forEach(p=>{
      p.days.forEach(d=>{
        const hay = (d.Topic+' '+d.Tasks+' '+d.Practice+' '+d.YT_Name+' '+d.Other_Name).toLowerCase();
        if(hay.indexOf(q) !== -1){
          matches.push({phase:p.num, phaseShort:p.short, day:d.Day, topic:d.Topic});
        }
      });
    });
    if(matches.length === 0){
      searchResults.innerHTML = '<div class="search-empty">No matches. Try another term.</div>';
    } else {
      searchResults.innerHTML = matches.slice(0,10).map(m=>
        `<div class="sr-item" role="option" data-phase="${m.phase}" data-day="${m.day}">
          <div class="sr-tag">PHASE ${pad2(m.phase)} · DAY ${pad2(m.day)} · ${m.phaseShort}</div>
          <div class="sr-title">${m.topic}</div>
        </div>`
      ).join("");
    }
    searchResults.classList.add("show");
  }

  function goToSearchResult(item){
    if(!item) return;
    const phase = item.dataset.phase, day = item.dataset.day;
    navigateTo("phase-"+phase);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const row = document.querySelector(`#view-phase-${phase} .day-row[data-key="p${phase}d${day}"]`);
      if(row){
        row.classList.add("open");
        row.querySelector(".day-head").setAttribute("aria-expanded","true");
        row.scrollIntoView({behavior:"smooth", block:"center"});
        row.style.outline = "2px solid var(--pcb)";
        row.style.outlineOffset = "-2px";
        setTimeout(()=>{ row.style.outline=""; row.style.outlineOffset=""; }, 1600);
      }
    }));
    searchResults.classList.remove("show");
    searchInput.value = "";
    closeSidebarMobile();
  }

  searchInput.addEventListener("input", (e)=>runSearch(e.target.value));
  searchInput.addEventListener("focus", (e)=>{ if(e.target.value.trim().length>=2) searchResults.classList.add("show"); });
  searchInput.addEventListener("keydown", (e)=>{
    const items = searchResults.querySelectorAll(".sr-item");
    if(e.key === "Escape"){ searchResults.classList.remove("show"); searchInput.blur(); return; }
    if(!items.length) return;
    if(e.key === "ArrowDown"){ e.preventDefault(); searchHighlight = (searchHighlight+1) % items.length; highlightItem(searchHighlight); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); searchHighlight = (searchHighlight-1+items.length) % items.length; highlightItem(searchHighlight); }
    else if(e.key === "Enter"){ e.preventDefault(); goToSearchResult(items[searchHighlight >= 0 ? searchHighlight : 0]); }
  });
  document.addEventListener("click",(e)=>{
    if(!searchResults.contains(e.target) && e.target !== searchInput){ searchResults.classList.remove("show"); }
  });
  searchResults.addEventListener("click",(e)=>{
    goToSearchResult(e.target.closest(".sr-item"));
  });

  /* ---------------- Toast ---------------- */
  const toastEl = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg, isError){
    toastEl.textContent = msg;
    toastEl.classList.toggle("error", !!isError);
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ toastEl.classList.remove("show"); }, 3200);
  }

  /* ---------------- Export / Import progress ---------------- */
  function exportProgress(){
    const doneKeys = Object.keys(state.done).filter(k=>state.done[k]);
    const payload = {
      type: "embedded-roadmap-progress",
      version: 1,
      exportedAt: new Date().toISOString(),
      totalDays: DATA.phases.reduce((s,p)=>s+p.days.length,0),
      done: state.done,
    };
    try{
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "embedded-roadmap-progress.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      showToast(`Exported ${doneKeys.length} completed day${doneKeys.length===1?"":"s"} — save this file to restore progress later.`);
    }catch(err){
      showToast("Couldn't export progress in this browser.", true);
    }
  }

  function importProgressFromFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const payload = JSON.parse(e.target.result);
        const incoming = payload && typeof payload.done === "object" ? payload.done : null;
        if(!incoming){ showToast("That file doesn't look like a progress export.", true); return; }
        state.done = {};
        Object.keys(incoming).forEach(k=>{ if(incoming[k]) state.done[k] = true; });
        viewRoot.querySelectorAll('input[type="checkbox"][data-key]').forEach(cb=>{
          cb.checked = !!state.done[cb.dataset.key];
        });
        refreshAllProgress();
        const n = Object.keys(state.done).length;
        showToast(`Imported progress — ${n} day${n===1?"":"s"} marked done.`);
      }catch(err){
        showToast("Couldn't read that file as progress JSON.", true);
      }
    };
    reader.onerror = ()=>showToast("Couldn't read that file.", true);
    reader.readAsText(file);
  }

  document.getElementById("exportBtn").addEventListener("click", exportProgress);
  const importFileInput = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", ()=>importFileInput.click());
  importFileInput.addEventListener("change", (e)=>{
    const file = e.target.files && e.target.files[0];
    importProgressFromFile(file);
    importFileInput.value = "";
  });

  /* ---------------- Reset progress ---------------- */
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(!confirm("Clear all checked-off days? Export first if you want to keep a copy — this can't be undone.")) return;
    state.done = {};
    viewRoot.querySelectorAll('input[type="checkbox"][data-key]').forEach(cb=>{ cb.checked = false; });
    refreshAllProgress();
    showToast("Progress reset.");
  });

  /* ---------------- Theme toggle buttons ---------------- */
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("themeToggleMobile").addEventListener("click", toggleTheme);

  /* ---------------- Mobile sidebar ---------------- */
  const menuBtn = document.getElementById("menuBtn");
  function openSidebarMobile(){ sidebar.classList.add("open"); overlay.classList.add("show"); }
  function closeSidebarMobile(){ sidebar.classList.remove("open"); overlay.classList.remove("show"); }
  menuBtn.addEventListener("click", openSidebarMobile);
  overlay.addEventListener("click", closeSidebarMobile);

  /* ---------------- Init ---------------- */
  renderNav();
  buildAllViews();
  refreshFootCount();
  showRoute(location.hash ? location.hash.replace("#","") : "overview");
})();
</script>
</body>
</html>
